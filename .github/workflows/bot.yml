name: EUROTOUR bot

# РОЗУМНА ЕСТАФЕТА
# GitHub убиває будь-яке завдання через 6 годин. Тому бот працює 5 год 20 хв,
# сам коректно зупиняється, зберігає базу і ОДРАЗУ запускає наступний цикл.
# Пауза між циклами — секунди, а не хвилини: користувач її не помічає.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"     # страхувальна сітка, якщо естафета обірвалась

concurrency:
  group: eurotour-bot          # ніколи не більше однієї копії — інакше Conflict
  cancel-in-progress: false

permissions:
  contents: write
  actions: write               # потрібно, щоб запустити наступний цикл

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Взяти код
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кеш бібліотек
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Встановити бібліотеки
        run: pip install -r requirements.txt

      # ── ВІДНОВЛЕННЯ ДАНИХ ──
      - name: Відновити базу з гілки bot-data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin bot-data >/dev/null 2>&1; then
            git fetch origin bot-data --depth=1 -q
            git checkout origin/bot-data -- data/eurotour.db 2>/dev/null || true
            if [ -f data/eurotour.db ]; then
              echo "База відновлена ($(stat -c%s data/eurotour.db) байт)"
            fi
          else
            echo "Перший запуск — база буде створена."
          fi

      # ── РОБОТА ──
      # 5 год 20 хв роботи. Ліміт GitHub — 6 год, тож лишається 40 хв запасу
      # на збереження бази й старт наступного циклу.
      - name: Запустити бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DB_PATH: ${{ github.workspace }}/data/eurotour.db
          RESTART_HOURS: "0"          # циклами керує GitHub, не бот
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Немає секрету BOT_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # SIGTERM за 5 год 20 хв — бот встигає коректно закрити БД
          timeout --signal=TERM --kill-after=60 19200 python -u s.py || true
          echo "Цикл завершено."

      # ── ЗБЕРЕЖЕННЯ ── (виконується завжди, навіть після збою)
      - name: Зберегти базу в гілку bot-data
        if: always()
        run: |
          [ -f data/eurotour.db ] || { echo "Бази немає"; exit 0; }
          # злити WAL у сам файл, щоб не втратити останні хвилини
          python - <<'PY'
          import sqlite3
          d = sqlite3.connect("data/eurotour.db")
          d.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          d.commit(); d.close()
          print("WAL злито у файл бази")
          PY
          git config user.name  "eurotour-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan tmp-data -q
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name data -exec rm -rf {} + 2>/dev/null || true
          git add -f data/eurotour.db
          git commit -q -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')" || { echo "Змін немає"; exit 0; }
          git push -f -q origin tmp-data:bot-data
          echo "База збережена в гілці bot-data"

      # ── ЕСТАФЕТА ──
      # Запускаємо наступний цикл ПІСЛЯ збереження бази.
      # concurrency не дасть двом копіям працювати одночасно: новий запуск
      # спокійно чекає в черзі, поки цей job повністю завершиться.
      - name: Передати естафету наступному циклу
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run bot.yml --ref ${{ github.ref_name }} \
            && echo "Наступний цикл поставлено в чергу" \
            || echo "Не вдалося — підхопить розклад (кожні 30 хв)"

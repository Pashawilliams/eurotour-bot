name: Тести

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 150 тестів функціоналу
        run: python test_bot.py
      - name: 16 тестів стійкості
        run: python test_resilience.py
      - name: 18 тестів збереження даних
        run: python test_persistence.py
